<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Vikram ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,
        #3b2148 0%,
        #171126 45%,
        #070711 100%);
    font-family:Georgia, serif;
    color:white;
}

/* Soft glowing background */

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(255,105,180,.12);
    filter:blur(80px);
    animation:glow 5s infinite alternate;
}

@keyframes glow{
    from{
        transform:scale(.8);
        opacity:.4;
    }
    to{
        transform:scale(1.3);
        opacity:.8;
    }
}

/* Message */

.card{
    position:relative;
    z-index:5;
    text-align:center;
    padding:40px 25px;
    max-width:650px;

    animation:appear 2s ease forwards;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.number{
    font-size:20px;
    letter-spacing:8px;
    color:#ffb6d9;
    margin-bottom:25px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        text-shadow:
        0 0 15px #ff69b4,
        0 0 30px #ff69b4;
    }
}

h1{
    font-size:42px;
    margin-bottom:25px;
    text-shadow:
        0 0 10px rgba(255,255,255,.5);
}

p{
    font-size:21px;
    line-height:1.8;
    color:#f5eaf1;
}

.highlight{
    color:#ffb6d9;
    text-shadow:0 0 10px rgba(255,105,180,.5);
}

.bottom{
    margin-top:30px;
    font-size:28px;
    animation:heart 1.5s infinite;
}

@keyframes heart{
    50%{
        transform:scale(1.15);
    }
}

/* Floating hearts */

.heart{
    position:absolute;
    bottom:-30px;
    font-size:20px;
    opacity:0;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Stars */

.star{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.2);
        text-shadow:0 0 12px white;
    }
}

/* Mobile */

@media(max-width:600px){

    h1{
        font-size:30px;
    }

    p{
        font-size:17px;
    }

    .number{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

    <div class="number">3 • 21</div>

    <h1>
        Happy Birthday Vikram 🎂❤️
    </h1>

    <p>
        Wish you many more happy returns of the day! ✨
        <br><br>

        <span class="highlight">
            Eppavum happy-ah iru... ❤️
        </span>
        <br>

        Life-la nee ninaikkira ellame
        <br>
        <span class="highlight">
            success aaganum. ✨
        </span>
    </p>

    <div class="bottom">
        ❤️ ✨ ❤️
    </div>

</div>

<script>

/* Floating Hearts */

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";

    const hearts=["❤️","💗","💕","✨","🤍"];

    heart.innerHTML=
        hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=
        (15+Math.random()*20)+"px";

    heart.style.animationDuration=
        (5+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,500);


/* Stars */

for(let i=0;i<35;i++){

    const star=document.createElement("div");

    star.className="star";

    star.innerHTML="✦";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.fontSize=
        (5+Math.random()*10)+"px";

    star.style.animationDelay=
        Math.random()*2+"s";

    document.body.appendChild(star);
}

</script>

</body>
</html>
